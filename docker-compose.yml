services:
  cut-url-api:
    build:
      context: ./cut-url-api
      dockerfile: Dockerfile
      args:
        user: juancab
        uid: 1000
    image: cut-url-api
    container_name: cut-url-api
    restart: unless-stopped
    working_dir: /var/www/cut-url-api
    volumes:
      - ./cut-url-api:/var/www/cut-url-api
    depends_on:
      - mysql
      - redis
    environment:
      - DB_HOST=mysql
      - REDIS_HOST=redis
    ports:
      - "9001:9000"
    networks:
      - cut_url

  url-stats:
    build:
      context: ./url-stats
      dockerfile: Dockerfile
      args:
        user: juancab
        uid: 1010
    image: url-stats
    container_name: url-stats
    restart: unless-stopped
    working_dir: /var/www/url-stats
    volumes:
      - ./url-stats:/var/www/url-stats
      - /var/www/url-stats/node_modules
    depends_on:
      - rabbitmq
    environment:
      - RABBITMQ_HOST=rabbitmq
    ports:
      - "3001:3000"
    networks:
      - cut_url
  
  url-app:
    build:
      context: ./url-app
      dockerfile: Dockerfile
      args:
        user: juancab
        uid: 1010
        
    image: url-app
    container_name: url-app
    restart: unless-stopped
    working_dir: /var/www/url-app
    volumes:
      - ./url-app:/var/www/url-app
    ports:
      - "5173:5173"
    networks:
      - cut_url
    environment:
      - CHOKIDAR_USEPOLLING=true
      - HOST=0.0.0.0

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: url_shortener
    ports:
      - "3307:3306"
    networks:
      - cut_url

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - cut_url

  rabbitmq:
    image: rabbitmq:management
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - cut_url

  nginx:
    image: nginx:alpine
    container_name: cut-url-nginx
    restart: unless-stopped
    ports:
      - "9002:80"
    volumes:
      - ./:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - cut-url-api
    networks:
      - cut_url

networks:
  cut_url:
    driver: bridge
    name: cut_url